name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - name: OpenAPI document is up to date
        run: |
          pnpm openapi:emit
          git diff --exit-code -- docs/api/openapi.json
      - run: pnpm build

  database:
    name: Migrations, RLS and Postgres-backed tests
    runs-on: ubuntu-latest
    env:
      # Supabase CLI local defaults; not secrets.
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_JWT_SECRET: super-secret-jwt-token-with-at-least-32-characters-long
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (applies migrations and seed)
        run: supabase --workdir infra start -x studio,imgproxy,logflare,vector,edge-runtime
      - name: pgTAP policy tests
        run: supabase --workdir infra test db
      - name: Postgres-backed API tests
        run: pnpm test:db
      - if: always()
        run: supabase --workdir infra stop --no-backup
